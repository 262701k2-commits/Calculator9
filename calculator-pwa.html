<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Calculator</title>
<meta name="theme-color" content="#f0c040">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calculator">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #1a1a1d;
    --surface2: #242428;
    --accent: #f0c040;
    --accent2: #e8874a;
    --text: #f0ede8;
    --muted: #6b6b72;
    --danger: #e05c5c;
    --radius: 18px;
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 80%, rgba(240,192,64,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 20%, rgba(232,135,74,0.07) 0%, transparent 60%);
    pointer-events: none;
  }

  .calc-wrapper {
    animation: floatIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
    width: 100%;
    max-width: 380px;
    padding: 16px;
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .calc {
    background: var(--surface);
    border-radius: 28px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04) inset;
  }

  .display {
    background: var(--bg);
    border-radius: var(--radius);
    padding: 20px 22px 16px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.05);
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    position: relative;
    overflow: hidden;
  }

  .display::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(240,192,64,0.3), transparent);
  }

  .expression {
    font-size: 13px;
    color: var(--muted);
    min-height: 20px;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }

  .result {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 44px;
    color: var(--text);
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1;
    transition: color 0.15s;
  }

  .result.accent { color: var(--accent); }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  button {
    border: none;
    border-radius: 14px;
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    cursor: pointer;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s, box-shadow 0.08s;
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  button::after {
    content: '';
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    transition: opacity 0.1s;
    border-radius: inherit;
  }

  button:active::after { opacity: 0.08; }
  button:active { transform: scale(0.93); }

  .btn-num {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    font-size: 20px;
    font-weight: 700;
  }

  .btn-op {
    background: rgba(240,192,64,0.12);
    color: var(--accent);
    border: 1px solid rgba(240,192,64,0.2);
    font-size: 22px;
    font-weight: 700;
  }

  .btn-clear {
    background: rgba(224,92,92,0.12);
    color: var(--danger);
    border: 1px solid rgba(224,92,92,0.2);
    font-weight: 700;
    font-size: 15px;
  }

  .btn-sign, .btn-percent {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid rgba(255,255,255,0.05);
    font-size: 16px;
  }

  .btn-eq {
    grid-column: span 2;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #1a1200;
    font-size: 24px;
    font-weight: 700;
    box-shadow: 0 4px 20px rgba(240,192,64,0.3);
  }

  .btn-dot {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.05);
    font-size: 24px;
  }

  .btn-zero {
    grid-column: span 2;
    justify-content: flex-start;
    padding-left: 24px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    font-size: 20px;
    font-weight: 700;
  }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transform: scale(0);
    animation: ripple 0.4s linear;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }

  .label {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-align: center;
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  /* Install banner */
  #install-banner {
    display: none;
    background: rgba(240,192,64,0.1);
    border: 1px solid rgba(240,192,64,0.25);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  #install-banner span { color: var(--accent); font-size: 12px; }
  #install-btn {
    background: var(--accent);
    color: #1a1200;
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    height: auto;
    width: auto;
    min-width: unset;
  }
  #install-btn:active { transform: scale(0.95); }
  .hide { display: none !important; }
</style>
</head>
<body>

<div class="calc-wrapper">
  <div id="install-banner" class="hide">
    <span>📲 Home Screen pe install karo!</span>
    <button id="install-btn" onclick="installApp()">Install</button>
  </div>

  <div class="calc">
    <div class="label">Calculator</div>
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="grid">
      <button class="btn-clear" onclick="clearAll(this)">AC</button>
      <button class="btn-sign" onclick="toggleSign(this)">+/−</button>
      <button class="btn-percent" onclick="percent(this)">%</button>
      <button class="btn-op" onclick="setOp('/', this)">÷</button>

      <button class="btn-num" onclick="num('7',this)">7</button>
      <button class="btn-num" onclick="num('8',this)">8</button>
      <button class="btn-num" onclick="num('9',this)">9</button>
      <button class="btn-op" onclick="setOp('*', this)">×</button>

      <button class="btn-num" onclick="num('4',this)">4</button>
      <button class="btn-num" onclick="num('5',this)">5</button>
      <button class="btn-num" onclick="num('6',this)">6</button>
      <button class="btn-op" onclick="setOp('-', this)">−</button>

      <button class="btn-num" onclick="num('1',this)">1</button>
      <button class="btn-num" onclick="num('2',this)">2</button>
      <button class="btn-num" onclick="num('3',this)">3</button>
      <button class="btn-op" onclick="setOp('+', this)">+</button>

      <button class="btn-zero" onclick="num('0',this)">0</button>
      <button class="btn-dot" onclick="dot(this)">.</button>
      <button class="btn-eq" onclick="calculate(this)">=</button>
    </div>
  </div>
</div>

<script>
  // ── Calculator Logic ──────────────────────────────
  let current = '0', previous = '', operator = null, justCalculated = false;
  const resultEl = document.getElementById('result');
  const exprEl   = document.getElementById('expression');

  function updateDisplay() {
    let d = current.length > 10 ? parseFloat(current).toPrecision(8) : current;
    resultEl.textContent = d;
    resultEl.style.fontSize = d.length > 9 ? '28px' : d.length > 7 ? '36px' : '44px';
  }

  function rippleEffect(btn) {
    if (!btn.offsetWidth) return;
    const r = document.createElement('span');
    r.className = 'ripple';
    const s = Math.max(btn.offsetWidth, btn.offsetHeight);
    r.style.cssText = `width:${s}px;height:${s}px;left:50%;top:50%;margin-left:${-s/2}px;margin-top:${-s/2}px`;
    btn.appendChild(r);
    setTimeout(() => r.remove(), 400);
  }

  function num(n, btn) {
    rippleEffect(btn);
    if (justCalculated) { current = n; justCalculated = false; }
    else current = current === '0' ? n : current + n;
    updateDisplay();
  }

  function dot(btn) {
    rippleEffect(btn);
    if (!current.includes('.')) current += '.';
    updateDisplay();
  }

  function setOp(op, btn) {
    rippleEffect(btn);
    if (operator && !justCalculated) {
      const res = compute(parseFloat(previous), parseFloat(current), operator);
      previous = String(res); current = String(res);
      updateDisplay();
    }
    operator = op; previous = current; justCalculated = true;
    exprEl.textContent = previous + ' ' + {'+':`+`,'-':`−`,'*':`×`,'/':'÷'}[op];
  }

  function compute(a, b, op) {
    return op==='+' ? a+b : op==='-' ? a-b : op==='*' ? a*b : b!==0 ? a/b : 'Error';
  }

  function calculate(btn) {
    rippleEffect(btn);
    if (!operator || previous === '') return;
    const sym = {'+':`+`,'-':`−`,'*':`×`,'/':'÷'}[operator];
    exprEl.textContent = `${previous} ${sym} ${current} =`;
    const res = compute(parseFloat(previous), parseFloat(current), operator);
    current = res === 'Error' ? 'Error' : String(parseFloat(res.toFixed(10)));
    operator = null; previous = ''; justCalculated = true;
    updateDisplay();
    resultEl.classList.add('accent');
    setTimeout(() => resultEl.classList.remove('accent'), 300);
  }

  function clearAll(btn) {
    rippleEffect(btn);
    current = '0'; previous = ''; operator = null; justCalculated = false;
    exprEl.textContent = '';
    updateDisplay();
  }

  function toggleSign(btn) {
    rippleEffect(btn);
    current = String(-parseFloat(current));
    updateDisplay();
  }

  function percent(btn) {
    rippleEffect(btn);
    current = String(parseFloat(current) / 100);
    updateDisplay();
  }

  document.addEventListener('keydown', e => {
    if ('0123456789'.includes(e.key)) num(e.key, document.body);
    else if (e.key==='.') dot(document.body);
    else if (e.key==='+') setOp('+', document.body);
    else if (e.key==='-') setOp('-', document.body);
    else if (e.key==='*') setOp('*', document.body);
    else if (e.key==='/') { e.preventDefault(); setOp('/', document.body); }
    else if (e.key==='Enter'||e.key==='=') calculate(document.body);
    else if (e.key==='Escape') clearAll(document.body);
    else if (e.key==='%') percent(document.body);
  });

  // ── PWA: Inline Manifest ──────────────────────────
  const manifest = {
    name: "Calculator",
    short_name: "Calc",
    description: "Stylish dark calculator",
    start_url: "./",
    display: "standalone",
    background_color: "#0e0e0f",
    theme_color: "#f0c040",
    orientation: "portrait",
    icons: [
      { src: makeIcon(192), sizes: "192x192", type: "image/png", purpose: "any maskable" },
      { src: makeIcon(512), sizes: "512x512", type: "image/png", purpose: "any maskable" }
    ]
  };

  function makeIcon(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#0e0e0f';
    ctx.beginPath();
    ctx.roundRect(0, 0, size, size, size * 0.22);
    ctx.fill();
    ctx.fillStyle = '#f0c040';
    ctx.font = `bold ${size * 0.45}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('=', size / 2, size / 2);
    return c.toDataURL('image/png');
  }

  const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  const manifestURL = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = manifestURL;
  document.head.appendChild(link);

  // ── PWA: Inline Service Worker ────────────────────
  const swCode = `
    const CACHE = 'calc-v1';
    self.addEventListener('install', e => {
      self.skipWaiting();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
    });
  `;
  const swBlob = new Blob([swCode], {type:'text/javascript'});
  const swURL  = URL.createObjectURL(swBlob);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register(swURL, {type:'classic'}).catch(()=>{});
  }

  // ── PWA: Install Prompt ───────────────────────────
  let deferredPrompt = null;
  const banner = document.getElementById('install-banner');

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    banner.classList.remove('hide');
  });

  function installApp() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      banner.classList.add('hide');
    });
  }

  window.addEventListener('appinstalled', () => banner.classList.add('hide'));
</script>
</body>
</html>
